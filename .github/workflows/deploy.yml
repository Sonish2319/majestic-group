name: Deploy Next.js App (Self Hosted)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Restart PM2
        run: |
          pm2 reload nextjs-app || pm2 start npm --name "nextjs-app" -- start
          pm2 save
